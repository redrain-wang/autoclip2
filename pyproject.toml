[project]
name = "autoclip"
version = "0.1.0"
description = "全自动影视解说短视频生产流水线"
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "edge-tts>=6.1",
    "python-dotenv>=1.0",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.0"]
mlx = ["mlx-whisper>=0.4"]

[project.scripts]
autoclip = "autoclip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autoclip"]
