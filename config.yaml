workdir: work          # 中间缓存（可断点续跑）
output_dir: output     # 成片输出

# 文本大模型：剧情梳理 / 导演选段 / 写解说稿。解说质量主要取决于它，建议用最强的模型。
# 任何 OpenAI 兼容接口均可：OpenAI、OpenRouter(可调 Claude/Gemini)、DeepSeek、通义、豆包……
# 优先用 OpenCode Go 套餐；额度用完或失败时自动降级到 DeepSeek 官方（fallback）
llm:
  model: deepseek-flash
  base_url: https://opencode.ai/zen/go/v1
  api_key_env: OPENCODE_API_KEY
  headers: {User-Agent: autoclip/0.1}
  session_header: x-opencode-session
  temperature: 0.8
  max_concurrency: 8
  json_mode: true
  fallback:
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DASHSCOPE_API_KEY   # 当前 .env 里 DeepSeek 官方 Key 存在这个变量名下
    temperature: 0.8
    max_concurrency: 8

# 视觉大模型：逐段看关键帧+台词并打分。调用量最大，选便宜快速的多模态模型。
vlm:
  model: deepseek-v4-flash-vision-exp
  base_url: https://opencode.ai/zen/go/v1
  api_key_env: OPENCODE_API_KEY
  headers: {User-Agent: autoclip/0.1}
  session_header: x-opencode-session
  temperature: 0.3
  max_concurrency: 6
  json_mode: false
  fallback:
    model: deepseek-flash            # 官方接口实测支持图片
    base_url: https://api.deepseek.com
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.3
    max_concurrency: 8

asr:
  backend: mlx                   # mlx(Apple Silicon 推荐) | faster-whisper | openai
  model: mlx-community/whisper-large-v3-turbo   # faster-whisper 填 large-v3
  language: zh
  use_sidecar_srt: true          # 视频旁有同名 .srt 时直接使用，跳过识别

tts:
  backend: edge                  # edge(免费) | openai
  voice: zh-CN-YunjianNeural     # 试听样本见 work/voice_test/；其他：zh-CN-YunxiNeural / zh-CN-YunyangNeural
  rate: "+20%"
  pitch: "+0Hz"
  pronounce:                     # 只替换配音文本，纠正多音字；字幕仍显示原文
    乡长: 乡掌
    县长: 县掌
    镇长: 镇掌
    村长: 村掌
    厂长: 厂掌
    所长: 所掌
    队长: 队掌
    校长: 校掌

analysis:
  scene_threshold: 0.3
  beat_min: 15
  beat_max: 50
  frames_per_beat: 4
  skip_head: 0                   # 跳过片头秒数
  skip_tail: 0                   # 跳过片尾秒数

render:
  layout: vertical               # vertical(1080x1920 抖音/快手) | horizontal(1920x1080 B站)
  font: PingFang SC
  duck_volume: 0.12              # 解说时原声音量
  bgm: null                      # 背景音乐文件路径
  bgm_volume: 0.06
  narration_ratio: 0.65
  crf: 20
  preset: medium
  workers: 3
  brand: 爱大片儿                 # 账号名
  watermark: assets/brand/logo.png   # 右上角水印；文件不存在时按 brand 自动生成，null 关闭
  watermark_opacity: 0.85
  cover: true                    # 同时导出封面 output/<成片名>.jpg

# 规格预设：--preset short,bili,recap 一次出多种规格；可写任意 render 字段和 mode/target_duration/genre/style/episodes
presets:
  short:            # 抖音/快手：每集按故事线出若干条，竖屏约 4 分钟，说书式（解说为主）
    mode: per_episode
    layout: vertical
    target_duration: 240
    narration_ratio: 0.6     # 解说占 60%，原声 40%
    narration_speed: 5.0
    count: auto     # 也可写固定数字；auto 时上限由 max_count 控制（默认 6）
  bili:             # B站/西瓜：每集一条，横屏 5 分钟
    mode: per_episode
    layout: horizontal
    target_duration: 300
  recap:            # 全剧浓缩：整部一条，横屏 10 分钟
    mode: whole
    layout: horizontal
    target_duration: 600
