episodes:
- ep: 1
  synopsis: 油坊营子乡极穷，乡食堂买菜打白条，债主与失地村民等郝运来。郝运来刚升副乡长，外出跑项目半月。马乡长即将调走，黄德强、老赵各打算盘；老书记病重尿血，郝运来赶回，连夜筹钱送医。黄德强通知债主来向郝运来要账。
- ep: 2
  synopsis: 老书记被郝运来夫妇连夜送县医院。贺书记来接人扑空。马乡长调走前，黄德强安排欢送并怂恿债主去郝家饭店；村民与债主因五十亩地冲突，仓子带人把马乡长吉普车抬上山藏起。郝运来追回，劝下村民，为马乡长举行抬车欢送。
- ep: 3
  synopsis: 债主围乡政府，郝运来立字据用乡政府新房抵押，承诺还钱，刘翠平不满。马乡长离乡。郝运来劝回抬车村民，在村中重树威信。梁玉芬作为南方公司经理来到油坊营子，谈起当年插队时郝运来救她的恩情。
- ep: 4
  synopsis: 梁玉芬带林三明考察神井水，住郝家。乡领导班子开会，黄德强、老赵争乡长，郝运来谈乡里困境。县里决定郝运来代理乡长。郝运来陪梁玉芬看神井，准备开发矿泉水。
- ep: 5
  synopsis: 县医院开会，黄德强、老赵批评郝运来素质经验不足，郝运来坦言跑项目难处。宣布郝运来代理乡长，黄、赵表面配合。郝运来上任，黄德强唆使胡权，胡权承包香油厂欠款不交。
- ep: 6
  synopsis: 郝运来上任后，黄德强、老赵称病回避；胡权送一万元，各村主任送礼。郝运来把礼送敬老院，宣布廉政，拒贿。他发现中学危房、教师欠薪，决定乡政府让房给学校。
- ep: 7
  synopsis: 全乡大会，郝运来宣布退五十亩地、乡政府搬学校、筹建神井矿泉水厂。胡权送的钱被交村抵承包费。梁玉芬带水样回省城化验。胡权怀恨，指使饭店停业并打砸其他饭店。
- ep: 8
  synopsis: 会上黄德强、老赵阻挠退地，郝运来坚持。乡政府腾房给学校，胡权送钱事被揭，郝运来让停业饭店整顿。胡权、胡二转而开非法水厂。
- ep: 9
  synopsis: 学校开学典礼，郝运来带乡政府搬进平房，债主感动。郝运来与梁玉芬去县里找马主任批矿泉水厂手续。村民抢木料，他劝退。仓子因欠胡权赌债上吊被救。
- ep: 10
  synopsis: 郝运来误把另一个马主任去世当成马乡长，闹出追悼会笑话；马主任没死，答应帮批项目。胡权指使胡二砸饭店，郝运来查案。仓子欠赌债两万，被胡权逼债上吊获救。
- ep: 11
  synopsis: 胡权抢先开非法“胡氏观音圣水厂”，郝运来查封并成立乡神井矿泉水厂筹备处。冲突中林三明被胡二一伙打伤，郝运来抓胡权、胡二，梁玉芬送三明就医。
- ep: 12
  synopsis: 林三明住院，小玲护理，刘翠平吃醋。胡权、胡二被放，黄德强回县活动。郝运来准备给老书记捐肾，刘翠平反对。郝运来与黄德强在乡政府激烈冲突。
- ep: 13
  synopsis: 县纪委调查组以受贿、偷税、破坏计生等停郝运来职，黄德强代理乡长。郝运来反省，刘翠平与调查组周旋；黄德强施压小秦。郝运来去县里见贺书记，老书记拒绝他捐肾。
- ep: 14
  synopsis: 郝运来在家反省，刘翠平闹着不让捐肾。黄德强代理后请陈大牛、电视台搞养牛专业村。调查组继续查，郝运来揭出胡权行贿真相，黄德强与胡权合谋栽赃。
- ep: 15
  synopsis: 黄德强虚报养牛专业村上电视，郝运来不满。老书记病重需换肾，郝运来要去捐肾被刘翠平拦。梁玉芬从北京回，牛总同意投资；黄德强与胡权合谋绑架林三明。
- ep: 16
  synopsis: 三堂会审澄清郝运来受贿、偷税、计生等问题，恢复代理乡长；黄德强因谎报养牛专业村被调离。老书记病重送医，梁玉芬、小玲、三明从北京回，水厂项目有转机。
- ep: 17
  synopsis: 黄德强离开，胡权扣下审批文件，并绑架林三明索赎金。郝运来重新上任，小秦揭发文件在胡权处；派出所抓胡权，郝运来组织上山救三明。
- ep: 18
  synopsis: 郝运来救出林三明，带其赴北京见牛总，牛总同意投资，并与梁玉芬结婚。郝老顺去世。神井矿泉水厂奠基，老书记换肾康复，郝运来正式宣布开工，刘翠平与他重归于好。
