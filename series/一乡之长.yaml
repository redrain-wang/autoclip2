notes: '《一乡之长》，1998 年播出的电视剧，东北乡土喜剧，用风趣写实的方式刻画乡镇基层官场的工作日常与人情世故。

  故事发生在油坊营子乡（台词常被识别成“游房营子”“油房营”）。全乡很穷：乡里唯一对外跑业务的是一辆破吉普车（司机柱子）；

  全乡教师半年没发工资，中学教室成了危房；乡政府办公楼的工程款一直拖欠；乡里到处是打白条的吃喝欠账。

  以下人物信息来自已发布的解说视频，可信：

  - 郝运来：主角。刚从村主任提拔为副乡长，后来接任乡长。实干、重情义、讲良心，在村民中威信高。台词里常被识别成“好运来”。

  - 刘翠平：郝运来的媳妇，开饭店，精明会算账，不愿意郝运来当官往家里贴钱。

  - 老书记：乡党委书记，病重住院，郝运来叫他“老叔”（是提拔郝运来的老领导，不是亲叔叔）。县委贺书记要来接他去城里转院。

  - 马乡长：从城里下来“镀金”的乡长，即将调回城里；任内强征五十亩耕地建度假村，项目烂尾，失地村民一分补偿没拿到；只惦记自己仕途。

  - 黄德强：副乡长，深谙基层门道的老油条，想接任乡长，分管财政账目，处处给郝运来下绊子。

  - 老赵：年岁已高的老副乡长，基本没有再往上走的机会，爱看黄德强笑话。

  - 贺书记：县委书记。

  - 柱子：乡里的司机。

  - 仓子：村民带头人（失地村民曾把公务车抬上山藏起来）。

  - 梁玉芬：南方投资公司的业务经理，当年在村里插队时被郝运来从野猪口下救过命。

  - 胡权：乡里开饭店的。

  - 老满叔：油坊营子村的村委会书记，大家都叫他“老满叔”“老满”。

  - 小玲：郝运来和刘翠平的女儿（不是“小莲”）。

  - 第18集去世的是郝老顺（郝运来的父亲）；老书记换肾后出院，恢复健康。

  人物称呼注意：郝运来当副乡长时，台词里的“马乡长”指马乡长本人，不是郝运来；但不带姓的“乡长”常常是司机柱子、村民对郝运来的称呼。

  台词里提到某人的名字，不代表此人在场；判断谁在场要看画面和称呼。

  '
style: 东北乡土喜剧，解说口吻接地气、带点调侃，但不挖苦小人物
intro: 1998年东北油坊营子乡，乡土喜剧。乡穷、欠账、教师停发工资、五十亩度假村烂尾。郝运来从村主任升副乡长，后接任乡长，凭实干和良心处理债务、退地、办学、办神井矿泉水厂，与黄德强等周旋，最终引资成功。
synopsis: 油坊营子乡穷困，马乡长搞五十亩度假村烂尾后调回城。郝运来从村主任提拔副乡长，老书记病重，他垫钱送医。县里任命郝运来代理乡长，他拒贿、退地、让乡政府给学校、筹建神井矿泉水厂。黄德强勾结胡权、胡二，停业砸店、打伤林三明、行贿诬告，使郝运来被停职。郝运来在刘翠平、老赵、小秦、仓子等支持下，三堂会审澄清恢复职务；黄德强调离，胡权绑架林三明索赎金，被抓获。梁玉芬带牛总投资，神井矿泉水厂奠基。老书记换肾康复，郝老顺去世。郝运来与刘翠平经历离婚风波后和好，继续带领全乡致富。
